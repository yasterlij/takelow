services:
  postgres-primary:
    image: citusdata/citus:12.1
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: takelow_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d takelow_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  identity-service:
    build: ./identity-service
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-secret}@postgres-primary:5432/takelow_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      FINTECH_WEBHOOK_SECRET: ${FINTECH_WEBHOOK_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    ports:
      - "3001:3000"
    networks:
      - backend
      - frontend

  auction-engine:
    build: ./auction-engine
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-secret}@postgres-primary:5432/takelow_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      SIKINA_SECRET_KEY: ${SIKINA_SECRET_KEY:-}
      SIKINA_WEBHOOK_SECRET: ${SIKINA_WEBHOOK_SECRET:-}
      SIKINA_BASE_URL: ${SIKINA_BASE_URL:-https://sandbox.sikinapay.com}
      SIKINA_SUCCESS_REDIRECT_URL: ${SIKINA_SUCCESS_REDIRECT_URL:-http://localhost?payment=success&clientReferenceId=CLIENT_REF}
      SIKINA_FAILED_REDIRECT_URL: ${SIKINA_FAILED_REDIRECT_URL:-http://localhost?payment=failed&clientReferenceId=CLIENT_REF}
      SIKINA_WEBHOOK_URL: ${SIKINA_WEBHOOK_URL:-}
      AWASH_MERCHANT_ID: ${AWASH_MERCHANT_ID:-}
      AWASH_SECRET_KEY: ${AWASH_SECRET_KEY:-}
      AWASH_WEBHOOK_SECRET: ${AWASH_WEBHOOK_SECRET:-}
      AWASH_BASE_URL: ${AWASH_BASE_URL:-https://sandbox.awashbank.com}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
      IDENTITY_SERVICE_URL: http://identity-service:3000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    ports:
      - "3002:3000"
    networks:
      - backend
      - frontend

  query-service:
    build: ./query-service
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      postgres-primary:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://admin:${POSTGRES_PASSWORD:-secret}@postgres-primary:5432/takelow_db
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost}
    ports:
      - "3003:3000"
    networks:
      - backend
      - frontend

  awash-bank-ui:
    build: ./awash-bank-ui-ux
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      - auction-engine
    environment:
      AWASH_API_URL: http://auction-engine:3000/api/v1
    ports:
      - "3004:3000"
    networks:
      - backend
      - frontend

  web:
    build: ./takelow-web
    platform: linux/arm64
    restart: unless-stopped
    depends_on:
      - identity-service
      - auction-engine
      - query-service
    ports:
      - "80:80"
    networks:
      - frontend

volumes:
  postgres_data:

networks:
  backend:
  frontend:
