name: TakeLow CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  EKS_CLUSTER: takelow-production
  AWS_REGION: us-east-1

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - identity-service
          - auction-engine
          - query-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - run: npm run build
        working-directory: ${{ matrix.service }}

      - run: npm test
        working-directory: ${{ matrix.service }}

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: takelow-web/package-lock.json

      - run: npm ci
        working-directory: takelow-web

      - run: npm run build
        working-directory: takelow-web

  docker-build:
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - identity-service
          - auction-engine
          - query-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest

  docker-build-web:
    needs: [test-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./takelow-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/takelow-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/takelow-web:latest

  deploy:
    needs: [docker-build, docker-build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER }} --region ${{ env.AWS_REGION }}

      - name: Apply K8s manifests
        run: |
          kubectl apply -f k8s/config.yaml
          kubectl apply -f k8s/deployments.yaml
          kubectl apply -f k8s/web.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Rollout restart
        run: |
          kubectl set image deployment/identity-service \
            identity-service=${{ env.REGISTRY }}/${{ github.repository }}/identity-service:${{ github.sha }}
          kubectl set image deployment/auction-engine \
            auction-engine=${{ env.REGISTRY }}/${{ github.repository }}/auction-engine:${{ github.sha }}
          kubectl set image deployment/query-service \
            query-service=${{ env.REGISTRY }}/${{ github.repository }}/query-service:${{ github.sha }}
          kubectl set image deployment/takelow-web \
            takelow-web=${{ env.REGISTRY }}/${{ github.repository }}/takelow-web:${{ github.sha }}

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/identity-service --timeout=300s
          kubectl rollout status deployment/auction-engine --timeout=300s
          kubectl rollout status deployment/query-service --timeout=300s
          kubectl rollout status deployment/takelow-web --timeout=300s

  load-test:
    needs: [deploy]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Seed load test tokens
        run: |
          node load-tests/seed-tokens.js 1000 > /tmp/k6-tokens.json

      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: load-tests/bid-flood.js
          flags: --vus 10000 --duration 60s
        env:
          BASE_URL: https://api.takelow.com/api/v1
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
