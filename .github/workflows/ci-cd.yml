name: TakeLow CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  AWS_REGION: us-east-1

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - identity-service
          - auction-engine
          - query-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - run: npm ci
        working-directory: ${{ matrix.service }}

      - run: npm run build
        working-directory: ${{ matrix.service }}

      - run: npm test --if-present
        working-directory: ${{ matrix.service }}

      - run: npx tsc --noEmit
        working-directory: ${{ matrix.service }}

  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: takelow-web/package-lock.json

      - run: npm ci
        working-directory: takelow-web

      - run: npm run build
        working-directory: takelow-web

  docker-build:
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - identity-service
          - auction-engine
          - query-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest

  docker-build-web:
    needs: [test-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build and push web Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./takelow-web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/takelow-web:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/takelow-web:latest

  deploy:
    needs: [docker-build, docker-build-web]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy services to Amazon ECS
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_REPOSITORY_PREFIX: ${{ env.REGISTRY }}/${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
          ECS_IDENTITY_SERVICE: ${{ vars.ECS_IDENTITY_SERVICE }}
          ECS_AUCTION_SERVICE: ${{ vars.ECS_AUCTION_SERVICE }}
          ECS_QUERY_SERVICE: ${{ vars.ECS_QUERY_SERVICE }}
          ECS_WEB_SERVICE: ${{ vars.ECS_WEB_SERVICE }}
          ECS_IDENTITY_CONTAINER: ${{ vars.ECS_IDENTITY_CONTAINER }}
          ECS_AUCTION_CONTAINER: ${{ vars.ECS_AUCTION_CONTAINER }}
          ECS_QUERY_CONTAINER: ${{ vars.ECS_QUERY_CONTAINER }}
          ECS_WEB_CONTAINER: ${{ vars.ECS_WEB_CONTAINER }}
        run: bash scripts/deploy-ecs.sh

