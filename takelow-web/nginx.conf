server {
    listen 80;
    server_name takelow.com;
    root /usr/share/nginx/html;
    index index.html;

    # --- Identity service (auth, wallet, notifications, admin users) ---
    location /api/v1/auth {
        proxy_pass http://identity-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/wallet {
        proxy_pass http://identity-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/notify {
        proxy_pass http://identity-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/admin/users {
        proxy_pass http://identity-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Auction engine (bidding, results, payments, admin auctions/products) ---
    # Regex takes priority over the prefix locations below for these dynamic paths.
    location ~ ^/api/v1/auctions/[^/]+/(bid|result)$ {
        proxy_pass http://auction-engine:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/payments {
        proxy_pass http://auction-engine:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/admin {
        proxy_pass http://auction-engine:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Query service (auction & product reads) ---
    location /api/v1/auctions {
        proxy_pass http://query-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/products {
        proxy_pass http://query-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /socket.io {
        proxy_pass http://auction-engine:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
